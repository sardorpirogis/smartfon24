<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smartfon24 | Kirish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { jakarta: ["Plus Jakarta Sans", "sans-serif"] },
        },
      },
    };
  </script>
</head>
<body class="font-jakarta min-h-screen bg-slate-100 text-slate-800">
  <main class="grid min-h-screen md:grid-cols-2">
    <section class="relative hidden md:block">
      <img src="https://images.unsplash.com/photo-1484704849700-f032a568e944?auto=format&fit=crop&w=1400&q=80" alt="Texnologiya fon rasmi" class="float-soft h-full w-full object-cover" />
      <div class="absolute inset-0 bg-slate-900/50"></div>
      <div class="absolute bottom-10 left-10 right-10 text-white">
        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-200">Smartfon24</p>
        <h1 class="mt-2 text-4xl font-extrabold">Shaxsiy kabinetingizga kirish</h1>
        <p class="mt-3 text-slate-200">Buyurtmalarni kuzating, servis holatini tekshiring va yangi aksiyalarni birinchi bo‘lib ko‘ring.</p>
      </div>
    </section>

    <section class="flex items-center justify-center px-4 py-10">
      <div class="hover-lift fade-in-up w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-lg">
        <a href="index.html" class="text-sm font-bold text-blue-700">← Bosh sahifaga qaytish</a>
        <h2 class="mt-4 text-3xl font-extrabold text-slate-900">Kirish</h2>
        <p class="mt-2 text-sm text-slate-500">Akkauntingizga kirib Smartfon24 xizmatlaridan foydalaning.</p>
        <form class="mt-6 space-y-4">
          <input type="email" placeholder="Email manzil" class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500" />
          <input type="password" placeholder="Parol" class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500" />
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 text-slate-600">
              <input type="checkbox" class="rounded border-slate-300" />
              Eslab qolish
            </label>
            <a href="#" class="font-semibold text-blue-700 hover:underline">Parolni unutdingizmi?</a>
          </div>
          <button type="submit" class="btn-pop w-full rounded-xl bg-blue-600 px-4 py-3 font-bold text-white transition hover:bg-blue-700">Kirish</button>
        </form>
        <p class="mt-5 text-sm text-slate-600">
          Akkaunt yo‘qmi?
          <a href="register.html" class="font-bold text-blue-700 hover:underline">Ro‘yxatdan o‘ting</a>
        </p>
      </div>
    </section>
  </main>
</body>
</html>
